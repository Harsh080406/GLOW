name: GLOW CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CI: true
  NODE_ENV: test
  JWT_SECRET: glow_ci_test_jwt_secret_key_2026_super_secure
  JWT_REFRESH_SECRET: glow_ci_test_jwt_refresh_key_2026_super_secure
  MONGODB_URI: mongodb://localhost:27017/glow_test?replicaSet=rs0

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Backend Tests & Database Migrations
  # Uses Docker to run an isolated single-node MongoDB replica set
  # ─────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start MongoDB Replica Set (rs0) Container
        run: |
          # 1. Start MongoDB 7.0 container with replica set enabled
          docker run -d --name mongo_rs -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all

          # 2. Wait until MongoDB accepts connections
          echo "Waiting for MongoDB container to initialize..."
          for i in {1..30}; do
            if docker exec mongo_rs mongosh --eval "db.runCommand({ ping: 1 })" > /dev/null 2>&1; then
              echo "MongoDB is accepting connections."
              break
            fi
            sleep 1
          done

          # 3. Initiate single-node replica set rs0 for transaction support
          docker exec mongo_rs mongosh --eval '
            try {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
              print("Replica set rs0 initiated successfully.");
            } catch (err) {
              print("Replica set notice: " + err);
            }
          '
          sleep 2
          docker exec mongo_rs mongosh --eval 'rs.status().ok'

      - name: Prepare Test Environment File
        run: |
          cp .env.production.example .env.production
          cp .env.production.example backend/.env

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Database Seeding & Migrations
        working-directory: backend
        run: npm run db:seed
        env:
          MONGODB_URI: mongodb://localhost:27017/glow_test?replicaSet=rs0
          NODE_ENV: test

      - name: Execute Node.js Security & RBAC Test Suite
        working-directory: backend
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/glow_test?replicaSet=rs0
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────
  # Job 2: Frontend Production Vite Bundle Build
  # ─────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Vite Static Bundle
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Job 3: Docker & Compose Packaging Validation
  # Verifies Dockerfiles and compose topology assemble cleanly
  # ─────────────────────────────────────────────────────────────
  docker-validation:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-build ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Prepare Environment File
        run: |
          cp .env.production.example .env.production

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Docker Image
        run: |
          docker build -t glow-backend:test ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t glow-frontend:test ./frontend
