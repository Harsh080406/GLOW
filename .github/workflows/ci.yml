name: GLOW CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CI: true
  NODE_ENV: test
  JWT_SECRET: glow_ci_test_jwt_secret_key_2026_super_secure
  JWT_REFRESH_SECRET: glow_ci_test_jwt_refresh_key_2026_super_secure
  MONGODB_URI: mongodb://localhost:27017/glow_test?replicaSet=rs0

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Backend Test Suite & Database Seeding / Migrations
  # Runs against an isolated MongoDB single-node replica set for ACID parity
  # ─────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --name mongo_ci
          --health-cmd "mongosh --port 27017 --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        # Start mongod with replica set enabled for Mongoose transactions
        entrypoint: mongod --replSet rs0 --bind_ip_all

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Mongosh CLI & Initialize MongoDB Replica Set (rs0)
        run: |
          # Install mongosh on Ubuntu runner
          sudo apt-get update && sudo apt-get install -y wget gnupg
          wget -qO- https://www.mongodb.org/static/pgp/server-7.0.asc | sudo tee /etc/apt/trusted.gpg.d/server-7.0.asc
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update && sudo apt-get install -y mongodb-mongosh

          # Wait for mongo port to accept traffic
          until mongosh --host localhost --port 27017 --eval 'db.runCommand({ ping: 1 })' > /dev/null 2>&1; do
            echo "Waiting for MongoDB service container..."
            sleep 1
          done

          # Initiate single-node replica set rs0 for transaction support
          mongosh --host localhost --port 27017 --eval '
            try {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
              print("Replica set rs0 initiated successfully.");
            } catch (err) {
              print("Notice: " + err);
            }
          '
          sleep 2
          mongosh --host localhost --port 27017 --eval 'rs.status().ok'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Database Seeding & Migrations
        working-directory: backend
        run: npm run db:seed
        env:
          MONGODB_URI: mongodb://localhost:27017/glow_test?replicaSet=rs0
          NODE_ENV: test

      - name: Execute Node.js Security & RBAC Test Suite
        working-directory: backend
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/glow_test?replicaSet=rs0
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────
  # Job 2: Frontend Linting & Production Vite Bundle Build
  # ─────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint Linter
        working-directory: frontend
        run: npx oxlint
        continue-on-error: true

      - name: Build Production Vite Static Bundle
        working-directory: frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Job 3: Docker & Compose Packaging Validation
  # Verifies multi-stage Dockerfiles and compose topology assemble cleanly
  # ─────────────────────────────────────────────────────────────
  docker-validation:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-build ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Backend Docker Image
        run: |
          docker build -t glow-backend:test ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t glow-frontend:test ./frontend
